mission_config:
  max_steps: 2000
  boundaries:
    x_boundary:
      min_cm: 0
      max_cm: 50
    y_boundary:
      min_cm: 0
      max_cm: 50
    height_boundary:
      min_cm: 0
      max_cm: 50
  gps_resolution_cm: 10   # GPS expected measurement precision

  # Optional: relative mapping resolution factor vs GPS.
  # Integer. If missing, defaults to 1. If < 1, ignored with an error log.
  # output_mapping_resolution_factor: 1

mission_config:
  max_steps: 2000
  # The underlying map spans height:[0,50] cm at this resolution, but this
  # mission is only cleared to operate on the ground floor -- a smaller,
  # non-trivial sub-region of the full map, not its whole extent.
  boundaries:
    x_boundary:
      min_cm: 0
      max_cm: 50
    y_boundary:
      min_cm: 0
      max_cm: 50
    height_boundary:
      min_cm: 0
      max_cm: 30
  gps_resolution_cm: 10   # GPS expected measurement precision
